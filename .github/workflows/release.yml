name: Release dist

# Pushing a version tag (v1.2.3) builds the package and publishes a sibling
# `<tag>-dist` tag whose commit includes the built dist/ on top of the
# tagged source commit. `dist/` stays gitignored on every branch — this is
# the only place it gets committed. Consumers install with:
#
#   "beastland": "github:CreativeBeastDesign/BeastLand#v1.2.3-dist"
#
# See HANDOFF.md for the release + local-dev flow.
on:
  push:
    tags:
      - "v*"
      - "!v*-dist"

permissions:
  contents: write

jobs:
  publish-dist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit dist and push as ${{ github.ref_name }}-dist
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f dist
          if git diff --cached --quiet; then
            echo "dist/ is unchanged from the tagged source; nothing to commit."
          else
            git commit -m "Build dist for ${{ github.ref_name }}"
          fi

          dist_tag="${{ github.ref_name }}-dist"
          git tag -f "$dist_tag"
          git push origin "refs/tags/$dist_tag" --force
